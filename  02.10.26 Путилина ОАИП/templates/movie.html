<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{{ movie.title }}</title>
</head>

<body>

<h1>{{ movie.title }}</h1>

<p>ГОД ВЫПУСКА: {{ movie.year }}</p>

<p>ЖАНР: {{ movie.genre }}</p>

<p>РЕЙТИНГ: {{ movie.rating }}</p>

{% if movie.rating >= 8.5 %}
    <p>!Рекомендуем посмотреть!</p>
{% endif %}

<p>ОПИСАНИЕ:</p>

<p>{{ movie.description }}</p>

<a href="/">НАЗАД</a>

</body>

</html>
