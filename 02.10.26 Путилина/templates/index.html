<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>КАТАЛОГ ФИЛЬМОВ/СЕРИАЛОВ</title>
</head>

<body>

<h1>МОИ ФИЛЬМЫ/СЕРИАЛЫ</h1>

{% for movie in movies %}

    <h2>{{ movie.title }}</h2>

    <p>Год: {{ movie.year }}</p>
    <p>Жанр: {{ movie.genre }}</p>
    <p>Рейтинг: {{ movie.rating }}</p>

    <a href="/movie/{{ movie.id }}">Подробнее</a>

    <hr>

{% endfor %}

</body>
</html>
